<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OLED wallpaper studio</title>
<link rel="icon" href="data:,">
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/webgpu": "/node_modules/three/build/three.webgpu.js",
    "three/tsl": "/node_modules/three/build/three.tsl.js",
    "three/examples/jsm/": "/node_modules/three/examples/jsm/",
    "three-mesh-bvh": "/node_modules/three-mesh-bvh/src/index.js",
    "three-mesh-bvh/webgpu": "/node_modules/three-mesh-bvh/src/webgpu/index.js",
    "three-gpu-pathtracer/webgpu": "/node_modules/three-gpu-pathtracer/src/webgpu/index.js",
    "three-gpu-pathtracer/": "/node_modules/three-gpu-pathtracer/"
  }
}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #101012;
    --panel: #17171a;
    --line: #2a2a2f;
    --text: #e6e6ea;
    --dim: #8b8b94;
    --accent: #7aa2ff;
    --bad: #ff7a6b;
    --good: #7fd6a0;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 360px; background: var(--bg); color: var(--text); }
  main { display: grid; grid-template-rows: 1fr auto; min-width: 0; padding: 20px; gap: 12px; }
  .stage { position: relative; display: grid; place-items: center; min-height: 0; }
  .frame { position: relative; background: #000; max-width: 100%; max-height: 100%; aspect-ratio: 3456 / 2234; width: 100%; box-shadow: 0 0 0 1px var(--line); }
  .frame canvas { width: 100%; height: 100%; display: block; }
  .safe { position: absolute; inset: 0; pointer-events: none; display: none; }
  .safe.on { display: block; }
  .safe div { position: absolute; border: 1px dashed rgba(255, 122, 107, 0.6); }
  .status { display: flex; gap: 16px; flex-wrap: wrap; color: var(--dim); font-variant-numeric: tabular-nums; }
  .status .bad { color: var(--bad); }
  .status .good { color: var(--good); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .bar { position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > label.key { color: var(--dim); width: 52px; flex: none; }
  .row > label.toggle { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  input[type=number], select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; font: inherit; min-width: 0; }
  input[type=number] { width: 100%; }
  select { flex: 1; }
  button { background: #222228; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #3d3d45; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  details { border-bottom: 1px solid var(--line); }
  summary { padding: 11px 16px; cursor: pointer; font-weight: 600; text-transform: capitalize; list-style: none; display: flex; justify-content: space-between; }
  summary::after { content: '+'; color: var(--dim); }
  details[open] summary::after { content: '−'; }
  .params { padding: 0 16px 12px; display: grid; gap: 9px; }
  .param { display: grid; grid-template-columns: 1fr 64px 22px; gap: 6px 8px; align-items: center; }
  .param .name { grid-column: 1 / 3; color: var(--dim); font-size: 12px; }
  .param input[type=range] { width: 100%; accent-color: var(--accent); }
  .param .value { font-variant-numeric: tabular-nums; text-align: right; font-size: 12px; }
  .param select, .param .check { grid-column: 1 / 3; }
  .lock { grid-row: 1 / 3; grid-column: 3; align-self: center; padding: 0; width: 22px; height: 22px; border-radius: 5px; font-size: 11px; color: var(--dim); }
  .lock.on { background: var(--accent); color: #0b1020; border-color: var(--accent); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="stage">
    <div class="frame" id="frame">
      <canvas id="view" width="864" height="559"></canvas>
      <div class="safe" id="safe"><div id="band"></div><div id="notch"></div></div>
    </div>
  </div>
  <div class="status" id="status">Starting the renderer…</div>
</main>
<aside>
  <div class="bar">
    <div class="row">
      <label class="key" for="seed">Seed</label>
      <input id="seed" type="number" min="0" step="1">
      <button id="reroll" title="New seed. Locked parameters stay.">Reroll</button>
    </div>
    <div class="row">
      <label class="key" for="preset">Preset</label>
      <select id="preset"><option value="">None</option></select>
    </div>
    <div class="row">
      <button id="final" class="primary">Render final</button>
      <button id="save">Save sidecar</button>
      <button id="load">Load sidecar</button>
      <input id="file" type="file" accept=".json" hidden>
    </div>
    <div class="row">
      <label class="toggle"><input id="showSafe" type="checkbox"> Show safe zones</label>
    </div>
  </div>
  <div id="groups"></div>
</aside>
<script type="module" src="./src/studio.js"></script>
</body>
</html>
